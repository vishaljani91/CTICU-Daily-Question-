const STORAGE_KEY = "cticu_dq_answers_v1";

function loadAnswers() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch(e) { return {}; }
}
function saveAnswer(id, choiceIdx) {
  const answers = loadAnswers();
  answers[id] = choiceIdx;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch(e) {}
}

// Local calendar date as YYYY-MM-DD (avoids UTC offset shifting the day)
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// Monday (YYYY-MM-DD) of the week containing the given ISO date. Weeks run Mon-Sun,
// so Sat/Sun still resolve back to that same week's Monday (access persists through
// the weekend and only locks out once the *next* Monday arrives).
function mondayOfWeek(iso) {
  const d = new Date(iso + "T00:00:00");
  const dow = d.getDay(); // 0=Sun..6=Sat
  const daysSinceMonday = (dow + 6) % 7;
  d.setDate(d.getDate() - daysSinceMonday);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// Full sorted list of all scheduled questions, past and future.
const SCHEDULE = QUESTIONS.slice().sort((a, b) => a.date.localeCompare(b.date));

function findQuestionForDate(iso) {
  return SCHEDULE.find(q => q.date === iso) || null;
}

// Access policy: only today's question, plus any missed questions from Monday of the
// current week through today. Nothing from prior weeks, and nothing from future dates —
// those are simply not shown, not just disabled.
function getVisibleSchedule() {
  const today = todayISO();
  const monday = mondayOfWeek(today);
  return SCHEDULE.filter(q => q.date >= monday && q.date <= today);
}

// Pick which question to show by default: today's if scheduled, otherwise the most
// recent one still within this week's visible window.
function getDefaultId(visible) {
  if (!visible.length) return null;
  const today = todayISO();
  const todayQ = visible.find(q => q.date === today);
  if (todayQ) return todayQ.id;
  return visible[visible.length - 1].id;
}

let currentId = getDefaultId(getVisibleSchedule());

function buildNav(visible) {
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  // Only show the catch-up strip when there's more than one day to choose from —
  // on a Monday (or the first day of content) it's just today's single question.
  nav.style.display = visible.length > 1 ? "flex" : "none";
  const answers = loadAnswers();
  visible.forEach(q => {
    const btn = document.createElement("button");
    const d = new Date(q.date + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    btn.textContent = `${q.day.slice(0,3)} ${label}`;
    btn.dataset.id = q.id;
    if (q.id === currentId) btn.classList.add("active");
    if (answers.hasOwnProperty(q.id)) btn.classList.add("done");
    btn.addEventListener("click", () => { currentId = q.id; render(); });
    nav.appendChild(btn);
  });
}

// Show only the difficulty portion of the label ("Level 4") — the topic
// half of the old label gave away the subject of the question before answering.
function levelOnly(label) {
  return String(label).split("·")[0].trim();
}

function buildTodayBanner(visible) {
  const banner = document.getElementById("todayBanner");
  const today = todayISO();
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const todayQ = findQuestionForDate(today);

  if (todayQ) {
    banner.textContent = `Today is ${dateStr}. Today's question is below.`;
  } else if (visible.length) {
    banner.textContent = `Today is ${dateStr} — no new question today. You can still catch up on this week's question(s) below before Monday.`;
  } else {
    banner.textContent = `Today is ${dateStr}. No question has been published yet this week — check back soon.`;
  }
}

function render() {
  const visible = getVisibleSchedule();
  if (currentId === null || !visible.some(q => q.id === currentId)) {
    currentId = getDefaultId(visible);
  }
  buildNav(visible);
  buildTodayBanner(visible);
  const card = document.getElementById("quizCard");

  if (!currentId) {
    card.innerHTML = `<div class="stem">No question is available yet this week. Check back soon.</div>`;
    return;
  }

  const q = QUESTIONS.find(x => x.id === currentId);
  const answers = loadAnswers();
  const alreadyAnswered = answers.hasOwnProperty(q.id);

  let optionsHtml = "";
  q.options.forEach((opt, idx) => {
    optionsHtml += `
      <label class="option" data-idx="${idx}">
        <input type="radio" name="opt" value="${idx}" ${alreadyAnswered ? "disabled" : ""}>
        <span>${opt}</span>
      </label>`;
  });

  card.innerHTML = `
    <div class="meta-row">
      <span class="level-badge">${levelOnly(q.levelLabel)}</span>
      <span class="day-label">${q.day}, ${new Date(q.date + "T00:00:00").toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="options" id="optionsList">${optionsHtml}</div>
    <button class="submit" id="submitBtn" ${alreadyAnswered ? "disabled" : ""}>${alreadyAnswered ? "Already Answered" : "Submit Answer"}</button>
    <div class="feedback" id="feedback"></div>
  `;

  if (alreadyAnswered) {
    showFeedback(q, answers[q.id]);
  }

  const optionEls = card.querySelectorAll(".option");
  optionEls.forEach(el => {
    el.addEventListener("click", () => {
      if (alreadyAnswered) return;
      optionEls.forEach(o => o.querySelector("input").checked = false);
      el.querySelector("input").checked = true;
    });
  });

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.addEventListener("click", () => {
    const checked = card.querySelector('input[name="opt"]:checked');
    if (!checked) { return; }
    const choiceIdx = parseInt(checked.value, 10);
    saveAnswer(q.id, choiceIdx);
    submitBtn.disabled = true;
    submitBtn.textContent = "Already Answered";
    optionEls.forEach(o => o.querySelector("input").disabled = true);
    showFeedback(q, choiceIdx);
    buildNav(getVisibleSchedule());
  });
}

function showFeedback(q, choiceIdx) {
  const card = document.getElementById("quizCard");
  const optionEls = card.querySelectorAll(".option");
  optionEls.forEach((el, idx) => {
    if (idx === q.correct) el.classList.add("correct");
    else if (idx === choiceIdx) el.classList.add("incorrect");
    el.classList.add("disabled");
  });
  const isRight = choiceIdx === q.correct;
  const fb = document.getElementById("feedback");
  fb.classList.add("show", isRight ? "right" : "wrong");
  fb.innerHTML = `
    <div class="fb-title ${isRight ? "right" : "wrong"}">${isRight ? "Correct" : "Incorrect — correct answer highlighted above"}</div>
    <div class="explanation">${q.explanation}</div>
    ${q.source ? `<div class="source">Source: ${q.source}</div>` : `<div class="no-source">No specific source cited — based on general clinical knowledge.</div>`}
  `;
}

render();
</script>
