<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMC CTICU Daily Question</title>
<style>
  :root {
    --navy: #0b2545;
    --blue: #1a5fb4;
    --blue-light: #e8f0fb;
    --green: #1c7c3f;
    --green-light: #e7f6ec;
    --red: #b3261e;
    --red-light: #fbeae9;
    --gray: #5b6472;
    --gray-light: #f4f5f7;
    --border: #dde2e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-light);
    color: #1c1f24;
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    color: #b9c7dd;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  nav.days {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 12px 16px 0;
    max-width: 640px;
    margin: 0 auto;
  }
  nav.days button {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: white;
    color: var(--gray);
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.days button.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  nav.days button.done::after {
    content: " \2713";
  }
  .today-banner {
    background: var(--blue-light);
    border: 1px solid #c7dbf5;
    color: var(--navy);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .level-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--blue-light);
    color: var(--blue);
  }
  .day-label {
    font-size: 0.78rem;
    color: var(--gray);
    font-weight: 600;
  }
  .topic {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--navy);
    margin: 2px 0 12px;
  }
  .stem {
    font-size: 0.98rem;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    cursor: pointer;
    font-size: 0.92rem;
    transition: border-color .15s, background .15s;
  }
  .option:hover { border-color: var(--blue); }
  .option input { margin-top: 3px; }
  .option.correct {
    background: var(--green-light);
    border-color: var(--green);
  }
  .option.incorrect {
    background: var(--red-light);
    border-color: var(--red);
  }
  .option.disabled { cursor: default; }
  button.submit {
    background: var(--blue);
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  button.submit:disabled {
    background: #aebfd8;
    cursor: not-allowed;
  }
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.right { background: var(--green-light); border: 1px solid var(--green); }
  .feedback.wrong { background: var(--red-light); border: 1px solid var(--red); }
  .feedback .fb-title {
    font-weight: 700;
    margin-bottom: 6px;
  }
  .feedback .fb-title.right { color: var(--green); }
  .feedback .fb-title.wrong { color: var(--red); }
  .explanation {
    margin-top: 10px;
    font-size: 0.88rem;
    color: #33393f;
  }
  .source {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--gray);
    font-style: italic;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .no-source {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #9aa2ab;
    font-style: italic;
  }
  footer {
    text-align: center;
    color: var(--gray);
    font-size: 0.75rem;
    padding: 24px 16px 40px;
  }
  .weekend-note {
    text-align: center;
    color: var(--gray);
    font-size: 0.85rem;
    padding: 6px 0 2px;
  }
</style>
</head>
<body>

<header>
  <h1>HUMC CTICU Daily Question</h1>
  <p>Cardiothoracic ICU educational quiz &mdash; one question a day, Monday&ndash;Friday</p>
</header>

<nav class="days" id="dayNav"></nav>

<div class="wrap">
  <div class="today-banner" id="todayBanner"></div>
  <div class="card" id="quizCard"></div>
</div>

<footer>
  Prepared for the HUMC CTICU Daily Question program.<br>
  Sourced questions cite their reference directly; unmarked questions reflect general clinical knowledge.
</footer>

<script>
const QUESTIONS = [
  {
    id: "mon",
    date: "2026-08-24",
    day: "Monday",
    level: 1,
    levelLabel: "Level 1 · Foundational Recognition",
    topic: "Post-Cardiac Surgery Mechanical Complications — Tamponade",
    stem: "A CTICU nurse is monitoring a patient who is post-op day 0 from CABG. Over the past two hours she notes: chest tube output steady at 250 mL/hr, heart rate rising from 88 to 124 bpm, MAP falling from 78 to 62 mmHg, and CVP rising from 8 to 15 mmHg.\n\nWhich of the following is the most likely explanation for this trend?",
    options: [
      "Hypovolemic shock from ongoing blood loss",
      "Cardiac tamponade",
      "Septic shock",
      "Acute pulmonary embolism"
    ],
    correct: 1,
    explanation: "Cardiac tamponade is listed as a mechanical complication of cardiac surgery, diagnosed by clinical scenario and echocardiography and typically treated with surgical re-exploration. The rising CVP with falling MAP and tachycardia reflects impaired diastolic filling from accumulating pericardial/mediastinal blood — distinct from hypovolemic shock, which would show a falling CVP.",
    source: "ATS Review for the Critical Care Boards, 1st ed., Chapter 6 (Surgery, Trauma, and Transplantation), p. 383."
  },
  {
    id: "tue",
    date: "2026-08-25",
    day: "Tuesday",
    level: 2,
    levelLabel: "Level 2 · Applied Diagnostics",
    topic: "Echocardiographic Classification of Shock",
    stem: "A hypotensive post-cardiac surgery patient undergoes bedside TTE. The study shows a large, poorly contractile left ventricle with no significant valvulopathy, small pericardial effusion, and a non-dilated IVC.\n\nWhich type of shock is most consistent with this echocardiographic picture?",
    options: [
      "Distributive shock",
      "Hypovolemic shock",
      "Cardiogenic shock",
      "Obstructive shock"
    ],
    correct: 2,
    explanation: "Cardiogenic shock is characterized echocardiographically by a large ventricle (or ventricles) with poor contractility, in contrast to hypovolemic shock (small chambers, normal/high contractility, collapsible IVC), distributive shock (small/normal chambers, preserved contractility), and obstructive shock (tamponade: small ventricles with dilated IVC; PE/pneumothorax: dilated RV).",
    source: "ATS Review for the Critical Care Boards, 1st ed., Chapter 7 (Cardiovascular), p. 532, Table 7-42."
  },
  {
    id: "wed",
    date: "2026-08-26",
    day: "Wednesday",
    level: 3,
    levelLabel: "Level 3 · Device Management",
    topic: "Mechanical Circulatory Support — IABP Waveform Troubleshooting",
    stem: "An IABP is in place for cardiogenic shock. The bedside nurse notes the augmentation waveform begins before the dicrotic notch, obliterating its sharp downstroke.\n\nThis finding is most consistent with which timing error, and what is its physiologic consequence?",
    options: [
      "Late inflation — submaximal augmentation",
      "Early inflation — increased afterload",
      "Late deflation — submaximal augmentation",
      "Early deflation — increased afterload"
    ],
    correct: 1,
    explanation: "Inflation should begin at the dicrotic notch (aortic valve closure). Early inflation — before the notch — causes premature aortic valve closure and increased LV afterload. Late inflation causes submaximal augmentation. Early deflation also causes submaximal augmentation. Late deflation increases afterload by keeping the balloon inflated into the start of systole.",
    source: "ATS Review for the Critical Care Boards, 1st ed., Chapter 7 (Cardiovascular), p. 510."
  },
  {
    id: "thu",
    date: "2026-08-27",
    day: "Thursday",
    level: 4,
    levelLabel: "Level 4 · Integrating Valve Pathophysiology with Device Selection",
    topic: "IABP Contraindications in Valvular Disease",
    stem: "A patient develops acute severe aortic regurgitation in cardiogenic shock while awaiting emergent valve surgery. A resident asks whether an IABP should be placed to stabilize hemodynamics in the interim.\n\nWhat is the most appropriate response?",
    options: [
      "Yes — IABP is first-line for any cardiogenic shock awaiting surgery",
      "No — IABP is contraindicated in aortic regurgitation because diastolic augmentation increases regurgitant flow",
      "Yes — IABP timing can be adjusted to avoid augmenting during regurgitation",
      "No — IABP is contraindicated only in mitral regurgitation, not aortic regurgitation"
    ],
    correct: 1,
    explanation: "Diastolic balloon inflation raises aortic diastolic pressure, which increases the pressure gradient driving blood backward across an incompetent aortic valve — worsening regurgitant volume and LV volume overload. Appropriate temporizing medical therapy prior to surgery instead includes nitroprusside for afterload reduction, dobutamine for inotropy, and isoproterenol for chronotropy.",
    source: "ATS Review for the Critical Care Boards, 1st ed., Chapter 7 (Cardiovascular), p. 519."
  },
  {
    id: "fri",
    date: "2026-08-28",
    day: "Friday",
    level: 5,
    levelLabel: "Level 5 · Expert Integrative Case",
    topic: "Post-Cardiac Surgery RV Failure — Mechanical Support Decision-Making",
    stem: "A 64-year-old is POD#1 s/p mitral valve replacement for severe MR with pre-existing pulmonary hypertension. She develops acute RV failure: CVP 24 mmHg, PAP 45/22 (mean 30), PCWP 12 mmHg, CI 1.6 L/min/m². Echo shows a severely dilated, hypokinetic RV with septal bowing into the LV and preserved LV function. She remains hypoperfused (rising lactate, oliguria) on maximal inotropes (milrinone + low-dose epinephrine) and inhaled pulmonary vasodilator.\n\nGiven this profile, which mechanical support strategy is most physiologically appropriate?",
    options: [
      "IABP placement to improve coronary perfusion",
      "Left-sided pVAD (e.g., Impella) to offload the LV",
      "Temporary RVAD (surgical or percutaneous) with continued pulmonary vasodilator optimization",
      "Peripheral VA-ECMO as first-line support"
    ],
    correct: 2,
    explanation: "This is isolated RV failure — high CVP relative to PCWP, septal bowing into the LV (ventricular interdependence reducing LV preload), and preserved LV systolic function. The priority is direct RV mechanical unloading combined with continued afterload reduction via pulmonary vasodilators. IABP offers no direct RV support. A left-sided pVAD doesn't address the RV pathology and could worsen septal shift. Peripheral VA-ECMO increases LV afterload unnecessarily when LV function is preserved and is generally reserved for biventricular failure.",
    source: null
  },
  {
    id: "bonus1",
    date: "2026-08-31",
    day: "Monday",
    level: 4,
    levelLabel: "Week 2 · Nephrology in Cardiac Surgery",
    topic: "Cardiac Surgery–Associated AKI Prevention",
    stem: "A cardiac surgery program wants to reduce postoperative AKI in high-risk patients identified by an elevated urinary [TIMP-2]×[IGFBP-7] biomarker. In a randomized trial, which perioperative strategy significantly reduced AKI incidence (55.1% vs. 71.7%, P=0.004)?",
    options: [
      "Prophylactic statin therapy",
      "A KDIGO-based care bundle: minimizing nephrotoxic agents, discontinuing ACE inhibitors, avoiding hyperglycemia, and optimizing volume status",
      "Aggressive intraoperative diuresis",
      "Preoperative IV albumin"
    ],
    correct: 1,
    explanation: "Statin use specifically was not shown to be of benefit for CSA-AKI prevention — the KDIGO bundle was (PrevAKI trial). CSA-AKI is the second most common cause of AKI in the ICU (behind sepsis), with time on cardiopulmonary bypass as one of the strongest predictors.",
    source: "Griffin BR, Liu KD, Teixeira JP. Critical Care Nephrology: Core Curriculum 2020. Am J Kidney Dis. 2020;75(3):435-452, p. 443."
  },
  {
    id: "bonus2",
    date: "2026-09-01",
    day: "Tuesday",
    level: 4,
    levelLabel: "Week 2 · Nephrology in Cardiac Surgery",
    topic: "Vasoplegic Shock After Cardiac Surgery",
    stem: "A patient develops vasodilatory (vasoplegic) shock six hours after CABG — low SVR with preserved cardiac output — refractory to escalating norepinephrine. Which agent has been specifically validated as effective for vasodilatory shock after cardiac surgery, with the added benefit of less atrial fibrillation than catecholamines?",
    options: [
      "Dopamine",
      "Vasopressin",
      "Dobutamine",
      "Milrinone"
    ],
    correct: 1,
    explanation: "Vasopressin acts via V1 receptors (nonadrenergic vasoconstriction) and has been specifically validated for post-cardiac-surgery vasoplegic shock, as well as being a catecholamine-sparing second-line agent in septic shock.",
    source: "Griffin BR, Liu KD, Teixeira JP. Critical Care Nephrology: Core Curriculum 2020. Am J Kidney Dis. 2020;75(3):435-452, p. 439."
  },
  {
    id: "bonus3",
    date: "2026-09-02",
    day: "Wednesday",
    level: 4,
    levelLabel: "Week 2 · Nephrology in Cardiac Surgery",
    topic: "ECMO/CRRT Circuit Integration",
    stem: "The team is placing CRRT in series with a VA-ECMO circuit for a patient with AKI. To minimize the risk of air or clot entrainment into the ECMO circuit, how should the CRRT circuit be connected?",
    options: [
      "CRRT inflow from a pre-pump segment; outflow to a post-oxygenator segment",
      "CRRT inflow from a post-pump segment; outflow to a pre-oxygenator segment",
      "Both CRRT inflow and outflow connected pre-pump",
      "A separate CRRT catheter should always be used instead"
    ],
    correct: 1,
    explanation: "Connecting CRRT inflow to a post-pump segment (higher positive pressure) minimizes air entrainment risk, and returning CRRT outflow to a pre-oxygenator segment lets the oxygenator filter out any air or clots from the CRRT circuit before they reach the patient.",
    source: "Griffin BR, Liu KD, Teixeira JP. Critical Care Nephrology: Core Curriculum 2020. Am J Kidney Dis. 2020;75(3):435-452, pp. 445-446, Fig. 6."
  }
];

const STORAGE_KEY = "cticu_dq_answers_v1";

function loadAnswers() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch(e) { return {}; }
}
function saveAnswer(id, choiceIdx) {
  const answers = loadAnswers();
  answers[id] = choiceIdx;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch(e) {}
}

// Local calendar date as YYYY-MM-DD (avoids UTC offset shifting the day)
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function isWeekend(iso) {
  const d = new Date(iso + "T00:00:00");
  const dow = d.getDay();
  return dow === 0 || dow === 6;
}

// Sorted list of scheduled questions by real calendar date (no day-of-week repeat —
// each date gets its own question so the program never recycles content week to week).
const SCHEDULE = QUESTIONS.slice().sort((a, b) => a.date.localeCompare(b.date));

function findQuestionForDate(iso) {
  return SCHEDULE.find(q => q.date === iso) || null;
}

// Pick which question to show by default: today's if scheduled, otherwise the most
// recently published question (so weekends / gaps show the latest content, not nothing).
function getDefaultId() {
  const today = todayISO();
  const todayQ = findQuestionForDate(today);
  if (todayQ) return todayQ.id;
  const past = SCHEDULE.filter(q => q.date <= today);
  if (past.length) return past[past.length - 1].id;
  return SCHEDULE[0].id;
}

let currentId = getDefaultId();

function buildNav() {
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  const answers = loadAnswers();
  SCHEDULE.forEach(q => {
    const btn = document.createElement("button");
    const d = new Date(q.date + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    btn.textContent = `${q.day.slice(0,3)} ${label}`;
    btn.dataset.id = q.id;
    if (q.id === currentId) btn.classList.add("active");
    if (answers.hasOwnProperty(q.id)) btn.classList.add("done");
    btn.addEventListener("click", () => { currentId = q.id; render(); });
    nav.appendChild(btn);
  });
}

function buildTodayBanner() {
  const banner = document.getElementById("todayBanner");
  const today = todayISO();
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const todayQ = findQuestionForDate(today);

  if (todayQ) {
    banner.textContent = `Today is ${dateStr}. Today's question: ${todayQ.topic}.`;
  } else if (isWeekend(today)) {
    banner.textContent = `Today is ${dateStr} — no new question on weekends. Showing the most recent question below; use the dates above to browse this week's set.`;
  } else if (today < SCHEDULE[0].date) {
    banner.textContent = `Today is ${dateStr}. The daily question program launches ${new Date(SCHEDULE[0].date + "T00:00:00").toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })} — showing a preview below.`;
  } else {
    banner.textContent = `Today is ${dateStr}. No question has been published for today yet — showing the most recent one below. (Ask your CTICU education team to add today's question!)`;
  }
}

function render() {
  buildNav();
  buildTodayBanner();
  const q = QUESTIONS.find(x => x.id === currentId);
  const card = document.getElementById("quizCard");
  const answers = loadAnswers();
  const alreadyAnswered = answers.hasOwnProperty(q.id);

  let optionsHtml = "";
  q.options.forEach((opt, idx) => {
    optionsHtml += `
      <label class="option" data-idx="${idx}">
        <input type="radio" name="opt" value="${idx}" ${alreadyAnswered ? "disabled" : ""}>
        <span>${opt}</span>
      </label>`;
  });

  card.innerHTML = `
    <div class="meta-row">
      <span class="level-badge">${q.levelLabel}</span>
      <span class="day-label">${q.day}, ${new Date(q.date + "T00:00:00").toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span>
    </div>
    <div class="topic">${q.topic}</div>
    <div class="stem">${q.stem}</div>
    <div class="options" id="optionsList">${optionsHtml}</div>
    <button class="submit" id="submitBtn" ${alreadyAnswered ? "disabled" : ""}>${alreadyAnswered ? "Already Answered" : "Submit Answer"}</button>
    <div class="feedback" id="feedback"></div>
  `;

  if (alreadyAnswered) {
    showFeedback(q, answers[q.id]);
  }

  const optionEls = card.querySelectorAll(".option");
  optionEls.forEach(el => {
    el.addEventListener("click", () => {
      if (alreadyAnswered) return;
      optionEls.forEach(o => o.querySelector("input").checked = false);
      el.querySelector("input").checked = true;
    });
  });

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.addEventListener("click", () => {
    const checked = card.querySelector('input[name="opt"]:checked');
    if (!checked) { return; }
    const choiceIdx = parseInt(checked.value, 10);
    saveAnswer(q.id, choiceIdx);
    submitBtn.disabled = true;
    submitBtn.textContent = "Already Answered";
    optionEls.forEach(o => o.querySelector("input").disabled = true);
    showFeedback(q, choiceIdx);
    buildNav();
  });
}

function showFeedback(q, choiceIdx) {
  const card = document.getElementById("quizCard");
  const optionEls = card.querySelectorAll(".option");
  optionEls.forEach((el, idx) => {
    if (idx === q.correct) el.classList.add("correct");
    else if (idx === choiceIdx) el.classList.add("incorrect");
    el.classList.add("disabled");
  });
  const isRight = choiceIdx === q.correct;
  const fb = document.getElementById("feedback");
  fb.classList.add("show", isRight ? "right" : "wrong");
  fb.innerHTML = `
    <div class="fb-title ${isRight ? "right" : "wrong"}">${isRight ? "Correct" : "Incorrect — correct answer highlighted above"}</div>
    <div class="explanation">${q.explanation}</div>
    ${q.source ? `<div class="source">Source: ${q.source}</div>` : `<div class="no-source">No specific source cited — based on general clinical knowledge.</div>`}
  `;
}

render();
</script>
</body>
</html>
